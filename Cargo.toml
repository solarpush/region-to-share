[workspace]
resolver = "2"
members = [
    "crates/region-core",
    "crates/region-config",
    "crates/region-platform",
    "crates/region-capture",
    "crates/region-portal",
    "crates/region-overlay",
    "crates/region-recorder",
    "crates/region-ipc",
    "crates/region-ui",
    "crates/region-cli",
]

[workspace.package]
version = "3.0.0"
edition = "2021"
rust-version = "1.80"
authors = ["Pierre Solar <pierre@solarpush.dev>"]
license = "MIT"
repository = "https://github.com/solarpush/region-to-share"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.40", features = ["full"] }
async-trait = "0.1"
futures-util = "0.3"

# Portal / Wayland / D-Bus
ashpd = { version = "0.13", features = ["screencast", "settings", "global_shortcuts", "notification"] }
zbus = { version = "5.0", default-features = false, features = ["tokio"] }
wayland-client = "0.31"

# PipeWire
pipewire = "0.9"
libspa = "0.9"

# X11
x11rb = { version = "0.13", features = ["shm", "xfixes", "render", "randr", "cursor", "shape"] }

# GUI / Graphics
eframe = "0.30"
egui = "0.30"
png = "0.18"
arboard = { version = "3.6", default-features = false }

# CLI / Utilities
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
crossbeam-channel = "0.5"
parking_lot = "0.12"
uuid = { version = "1", features = ["v4"] }
rust-i18n = "3"
sys-locale = "0.3"

# Logging / Errors
log = "0.4"
env_logger = "0.11"
thiserror = "1"

# System
libc = "0.2"

# Internal workspace crates
region-core = { path = "crates/region-core" }
region-config = { path = "crates/region-config" }
region-platform = { path = "crates/region-platform" }
region-capture = { path = "crates/region-capture" }
region-portal = { path = "crates/region-portal", default-features = false }
region-overlay = { path = "crates/region-overlay" }
region-recorder = { path = "crates/region-recorder" }
region-ipc = { path = "crates/region-ipc" }
region-ui = { path = "crates/region-ui" }

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[profile.bench]
inherits = "release"
debug = true
